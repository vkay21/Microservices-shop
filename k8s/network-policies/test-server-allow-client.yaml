apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: test-server-allow-client
  namespace: microservices-shop
spec:
  podSelector:
    matchLabels:
      app: test-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              run: test-client
      ports:
        - protocol: TCP
          port: 80
