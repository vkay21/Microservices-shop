# Run from the repo root:  docker compose up --build
# Product and Order services get added here in the next steps.
services:
  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER} -d users"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    build: ./services/user-service
    environment:
      DATABASE_URL: postgresql+psycopg://${USER_DB_USER}:${USER_DB_PASSWORD}@user-db:5432/users
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8001:8000"
    depends_on:
      user-db:
        condition: service_healthy

volumes:
  user-db-data:
